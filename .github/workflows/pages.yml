# Publiserer nettsidene i ./web til GitHub Pages.
# Krever: Settings › Pages › Build and deployment › Source = «GitHub Actions».
name: Publiser nettsider

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hent kode
        uses: actions/checkout@v5

      - name: Sett opp Pages
        uses: actions/configure-pages@v5

      - name: Last opp web-mappen
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@v4
